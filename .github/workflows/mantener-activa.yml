# Tarea programada: evita que el proyecto gratuito de Supabase se hiberne.
# Supabase pausa los proyectos gratuitos tras ~7 días sin actividad. Esta tarea
# llama a la función ping() (solo devuelve la hora) lunes, miércoles y viernes.
# Usa la clave publicable (pública por diseño); no necesita secretos.
# Se puede lanzar a mano desde GitHub → Actions → «Mantener Supabase activo».
name: Mantener Supabase activo
on:
  schedule:
    - cron: "23 13 * * 1,3,5"   # 13:23 UTC (9:23 en Venezuela)
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_URL: https://getnxeflqaqzdujbxqeu.supabase.co
      SUPABASE_KEY: sb_publishable_JlIL10KIgsi16xgCwK_soA_yF3MZ7HV
    steps:
      - name: Llamar a ping()
        run: |
          for intento in 1 2 3; do
            code=$(curl -s -o respuesta.txt -w "%{http_code}" -X POST "$SUPABASE_URL/rest/v1/rpc/ping" \
              -H "apikey: $SUPABASE_KEY" -H "Authorization: Bearer $SUPABASE_KEY" -H "Content-Type: application/json" -d '{}')
            echo "Intento $intento → HTTP $code · $(cat respuesta.txt)"
            [ "$code" = "200" ] && exit 0
            sleep 30   # si estaba hibernada, el primer intento la despierta
          done
          echo "::error::Supabase no respondió. Revisa el proyecto en el dashboard."
          exit 1
