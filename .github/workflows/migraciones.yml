# Aplica a Supabase las migraciones nuevas cuando llegan a main.
# Requiere dos secretos en GitHub → Settings → Secrets and variables → Actions:
#   SUPABASE_ACCESS_TOKEN  (supabase.com/dashboard/account/tokens)
#   SUPABASE_DB_PASSWORD   (contraseña de la base del proyecto)
# Sin esos secretos el trabajo se salta y no falla.
name: Migraciones
on:
  push:
    branches: [main]
    paths: ["supabase/migrations/**"]
  workflow_dispatch:
jobs:
  push:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: getnxeflqaqzdujbxqeu
    steps:
      - uses: actions/checkout@v4
      - name: Revisar migraciones
        run: node scripts/lint-migrations.mjs
      - uses: supabase/setup-cli@v1
        if: env.SUPABASE_ACCESS_TOKEN != ''
        with: { version: latest }
      - name: Comparar historial remoto y aplicar lo pendiente
        if: env.SUPABASE_ACCESS_TOKEN != ''
        run: |
          supabase link --project-ref "$PROJECT_REF" -p "$SUPABASE_DB_PASSWORD"
          supabase migration list -p "$SUPABASE_DB_PASSWORD"
          supabase db push -p "$SUPABASE_DB_PASSWORD"
