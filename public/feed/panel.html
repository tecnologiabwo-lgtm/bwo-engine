/* Actividad compartida con BWO Engine (expiración de sesión por inactividad) */
(function(){var t=0;function m(){var n=Date.now();if(n-t>5000){t=n;try{localStorage.setItem('bwo.lastActivity',String(n));}catch(e){}}}
