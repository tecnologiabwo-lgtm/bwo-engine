<!DOCTYPE html>
<html lang="es">
<head>
<script>
/* Errores del Feed clásico → registro de errores de BWO Engine (client_errors) */
(function(){var n=0,last={};function send(msg,stack,src){try{msg=String(msg||'Error').slice(0,1000);if(/ResizeObserver|Script error/i.test(msg))return;var t=Date.now();if(last[msg]&&t-last[msg]<60000)return;last[msg]=t;if(++n>20)return;
fetch('https://getnxeflqaqzdujbxqeu.supabase.co/rest/v1/rpc/log_client_error',{method:'POST',headers:{'Content-Type':'application/json',apikey:'sb_publishable_JlIL10KIgsi16xgCwK_soA_yF3MZ7HV',Authorization:'Bearer sb_publishable_JlIL10KIgsi16xgCwK_soA_yF3MZ7HV'},
body:JSON.stringify({p_message:msg,p_stack:stack?String(stack).slice(0,6000):null,p_url:location.pathname,p_release:'feed-clasico',p_user_agent:navigator.userAgent.slice(0,300),p_context:{source:src}})}).catch(function(){});}catch(e){}}
addEventListener('error',function(e){send(e.message,e.error&&e.error.stack,'feed.error');});
addEventListener('unhandledrejection',function(e){var r=e.reason||{};send(r.message||r,r.stack,'feed.promise');});})();
</script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" sizes="32x32" href="/brand/favicon-32.png">

<link rel="stylesheet" href="./src/css/components/stories.css">
<link rel="stylesheet" href="./src/css/components/zoom.css">
<link rel="stylesheet" href="./src/css/components/timeline.css">
<script src="./vendor/supabase.js"></script>
</head>
<body>
<div id="root"><div class="loader">Cargando tu feed…</div></div>

<div id="selRoot"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script type="module" src="./src/js/pages/cliente.js"></script>
<script>
/* Actividad compartida con BWO Engine (expiración de sesión por inactividad) */
(function(){var t=0;function m(){var n=Date.now();if(n-t>5000){t=n;try{localStorage.setItem('bwo.lastActivity',String(n));}catch(e){}}}
['pointerdown','keydown','scroll','touchstart','wheel'].forEach(function(e){addEventListener(e,m,{passive:true});});})();
</script>
